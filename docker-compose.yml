# ============================================================================
# docker-compose.yml – ResFiT training on GPU servers
# ============================================================================
# Usage:
#   1. Copy .env.example → .env and fill in your keys
#   2. docker compose build
#   3. docker compose run --rm --name qte9489-resfit-train train bash
#   4. docker compose run --rm --name qte9489-resfit-train train python ...
# ============================================================================

services:
  train:
    build:
      context: .
      dockerfile: Dockerfile
    image: qte9489-resfit:latest
    container_name: qte9489-resfit-train

    # ── GPU access ──
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all        # or set to 1 if you want a single GPU
              capabilities: [gpu]

    # ── Environment (secrets from .env file) ──
    env_file:
      - .env

    environment:
      - PYTHONPATH=/app
      - MUJOCO_GL=egl
      - PYOPENGL_PLATFORM=egl
      - MPLBACKEND=Agg
      # All run_*, bc_run_*, buffer caches write here (mounted to host)
      - CACHE_DIR=/app/data
      # Prevent OOM on 16GB GPUs
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True

    # ── Volumes ──
    volumes:
      # Persist HuggingFace datasets cache between runs (avoids re-downloading 655MB)
      - hf-cache:/root/.cache/huggingface
      # Persist wandb cache
      - wandb-cache:/root/.local/share/wandb
      # ── Live code mount ──
      # Mounts the host repo over /app so git pull instantly reflects in container.
      # No rebuild needed for code changes!
      - .:/app
      # ── Preserve deps from image (would be hidden by the .:/app mount) ──
      # These named volumes are initialized from the image on first run.
      - deps-lerobot:/app/deps/lerobot
      - deps-robosuite:/app/deps/robosuite
      - deps-dexmimicgen:/app/deps/dexmimicgen
      - deps-mimicgen:/app/deps/mimicgen
      # ── All training data persists on host filesystem ──
      # CACHE_DIR is where run_*, bc_run_*, offline_buffer_cache/, online_buffer_cache/ go.
      - ./data:/app/data

    # ── Resource limits (be nice on shared servers) ──
    shm_size: '16gb'  # needed for PyTorch DataLoader with shared memory
    ulimits:
      memlock:
        soft: -1
        hard: -1

    # ── Networking ──
    network_mode: host  # simplest for corporate VPN – uses host network directly

    # Keep stdin open for interactive use
    stdin_open: true
    tty: true

    # Default: drop into bash (override with docker compose run --rm train python ...)
    command: ["/bin/bash"]

volumes:
  hf-cache:
  wandb-cache:
  deps-lerobot:
  deps-robosuite:
  deps-dexmimicgen:
  deps-mimicgen:
